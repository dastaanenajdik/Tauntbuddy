# TauntBuddy static analysis configuration.
# Docs: https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # Missing awaits / imports should be visible in every PR.
    unawaited_futures: warning
    missing_required_param: error
    missing_return: error
    # Intentionally relaxed: TauntBuddy touches BuildContext across async gaps
    # *after* mounted guards, which the rule cannot see through.
    use_build_context_synchronously: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_lambdas
    - use_super_parameters

