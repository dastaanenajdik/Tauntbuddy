# TauntBuddy static analysis configuration.
# Docs: https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
  errors:
    # Missing awaits / imports should be visible in every PR.
    unawaited_futures: warning
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_lambdas
    - use_super_parameters

    # Intentionally relaxed: TauntBuddy renders a lot of deliberately short-lived
    # UI copy and uses BuildContext across async gaps *after* mounted guards,
    # which the default rule cannot understand.
    use_build_context_synchronously: false
