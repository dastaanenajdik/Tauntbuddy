<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="spellcheck" content="false" />
  <meta name="description" content="TauntBuddy Exam Hub — full syllabi, a day-by-day exam planner and a built-in Pomodoro timer for India's toughest exams." />
  <title>TauntBuddy Exam Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <!-- Preload the first paint's hero image so the desktop hero is instant -->
  <link rel="preload" as="image" href="./assets/bg-home.jpg" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/views.css" />
</head>
<body spellcheck="false">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">TauntBuddy Exam Hub
        <small>Courses · Day-by-day Planner · Pomodoro</small>
      </a>
      <button class="timestrip" id="timeStrip" type="button" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="timeStripClock">25:00</span>
        <span id="timeStripLabel">Focus</span>
      </button>
      <nav class="nav" aria-label="Primary">
        <a data-nav href="#/">Home</a>
        <a data-nav href="#/courses">Courses</a>
        <a data-nav href="#/planner">Planner</a>
        <a data-nav href="#/pomodoro">Pomodoro</a>
      </nav>
    </header>
    <main id="view" class="view"></main>
    <footer class="note">
      Syllabus maps are study aids, not official papers. Mark units complete as
      you finish them — "kyuki kal karunga se degree nahi milti."
    </footer>
  </div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
